<style>
:root { --bg:#0e0f0e; --surface:#161816; --surface2:#1e211e; --border:#2a2e2a; --income:#4ade80; --expense:#f87171; --accent:#b5e853; --text:#e8ede8; --dim:#6b7a6b; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:'DM Mono',monospace; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
.box { background:var(--surface); border:1px solid var(--border); border-top:2px solid var(--accent); padding:2rem; max-width:520px; width:100%; }
h1 { font-family:'Fraunces',serif; font-size:1.3rem; color:var(--accent); margin-bottom:0.3rem; }
.sub { font-size:0.65rem; color:var(--dim); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:1.5rem; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); margin-bottom:1.5rem; }
.stat { background:var(--surface2); padding:0.9rem; text-align:center; }
.stat-val { font-family:'Fraunces',serif; font-size:1.1rem; margin-bottom:0.2rem; }
.stat-val.g { color:var(--income); }
.stat-val.r { color:var(--expense); }
.stat-val.a { color:var(--accent); }
.stat-lbl { font-size:0.58rem; color:var(--dim); text-transform:uppercase; letter-spacing:0.08em; }
.progress-wrap { margin-bottom:1rem; }
.progress-bar-bg { height:4px; background:var(--surface2); border-radius:2px; overflow:hidden; margin-bottom:0.5rem; }
.progress-bar { height:4px; background:var(--accent); border-radius:2px; width:0%; transition:width 0.3s; }
.progress-txt { font-size:0.68rem; color:var(--dim); min-height:1.2rem; }
.log { background:var(--surface2); border:1px solid var(--border); padding:0.8rem; height:140px; overflow-y:auto; font-size:0.65rem; color:var(--dim); line-height:1.8; margin-bottom:1rem; }
.log .ok  { color:var(--income); }
.log .err { color:var(--expense); }
.btn { width:100%; padding:0.85rem; background:var(--accent); color:var(--bg); border:none; font-family:'DM Mono',monospace; font-size:0.8rem; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; cursor:pointer; border-radius:2px; transition:opacity 0.2s; }
.btn:hover { opacity:0.85; }
.btn:disabled { opacity:0.4; cursor:not-allowed; }
.btn-back { width:100%; padding:0.6rem; background:transparent; color:var(--dim); border:1px solid var(--border); font-family:'DM Mono',monospace; font-size:0.7rem; letter-spacing:0.08em; text-transform:uppercase; cursor:pointer; border-radius:2px; margin-top:0.6rem; }
.btn-back:hover { border-color:var(--accent); color:var(--accent); }
.warning { font-size:0.65rem; color:var(--dim); text-align:center; margin-top:0.8rem; line-height:1.6; }
</style>
</head>

function log(msg, tipo='ok') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${tipo}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function setProgress(n, total) {
  document.getElementById('bar').style.width = (n/total*100) + '%';
  document.getElementById('progressTxt').textContent = `${n} de ${total} registros`;
}

window.importar = async function() {
  const cfg = JSON.parse(localStorage.getItem('finPR_fbConfig') || 'null');
  if (!cfg) {
    alert('Primero configura Firebase en la app principal (index.html).');
    return;
  }

  const btn = document.getElementById('btnImport');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';

  try {
    const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const { getFirestore, collection, addDoc, serverTimestamp } = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');

    const app = initializeApp(cfg, 'import-instance');
    const db  = getFirestore(app);
    const col = collection(db, 'movimientos');

    let ok = 0, errors = 0;
    for (let i = 0; i < DATA.length; i++) {
      const m = DATA[i];
      try {
        await addDoc(col, {
          tipo: m.tipo, fecha: m.fecha, desc: m.desc,
          cat: m.cat, monto: m.monto, notas: m.notas,
          createdAt: serverTimestamp()
        });
        ok++;
        setProgress(i+1, DATA.length);
        if (ok % 10 === 0 || ok === DATA.length) {
          log(`✓ ${ok} registros subidos...`);
        }
      } catch(e) {
        errors++;
        log(`✗ Error en "${m.desc}": ${e.message}`, 'err');
      }
    }

    document.getElementById('progressTxt').textContent = `✓ Completado — ${ok} registros importados${errors ? `, ${errors} errores` : ''}`;
    log(`\n🎉 Importación completada: ${ok} OK, ${errors} errores.`);
    btn.textContent = '✓ Importado — no ejecutar de nuevo';
  } catch(e) {
    log(`✗ Error fatal: ${e.message}`, 'err');
    btn.disabled = false;
  }
};
</script>
</body>
</html>
